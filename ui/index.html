<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solomon — local AI assistant interface" />
  <title>Solomon</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap"
    rel="stylesheet" />

  <!-- THREE.JS r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Bulletproof patch for THREE.BufferGeometry's computeBoundingSphere and computeBoundingBox
    // against any temporary NaN or uninitialized vertex values in global Three.js loaded from CDN.
    if (typeof THREE !== 'undefined' && THREE.BufferGeometry) {
      THREE.BufferGeometry.prototype.computeBoundingSphere = function () {
        if (!this.boundingSphere) {
          this.boundingSphere = new THREE.Sphere();
        }
        const position = this.attributes.position;
        if (position && position.count > 0) {
          const center = this.boundingSphere.center;
          let sumX = 0, sumY = 0, sumZ = 0;
          let validCount = 0;
          for (let i = 0, il = position.count; i < il; i++) {
            const x = position.getX(i);
            const y = position.getY(i);
            const z = position.getZ(i);
            if (!isNaN(x) && !isNaN(y) && !isNaN(z) && isFinite(x) && isFinite(y) && isFinite(z)) {
              sumX += x;
              sumY += y;
              sumZ += z;
              validCount++;
            }
          }
          if (validCount > 0) {
            center.set(sumX / validCount, sumY / validCount, sumZ / validCount);
            let maxRadiusSq = 0;
            for (let i = 0, il = position.count; i < il; i++) {
              const x = position.getX(i);
              const y = position.getY(i);
              const z = position.getZ(i);
              if (!isNaN(x) && !isNaN(y) && !isNaN(z) && isFinite(x) && isFinite(y) && isFinite(z)) {
                const dx = x - center.x;
                const dy = y - center.y;
                const dz = z - center.z;
                const distSq = dx * dx + dy * dy + dz * dz;
                if (distSq > maxRadiusSq) {
                  maxRadiusSq = distSq;
                }
              }
            }
            this.boundingSphere.radius = Math.sqrt(maxRadiusSq);
          } else {
            center.set(0, 0, 0);
            this.boundingSphere.radius = 300;
          }
        } else {
          this.boundingSphere.center.set(0, 0, 0);
          this.boundingSphere.radius = 300;
        }
        if (isNaN(this.boundingSphere.radius) || !isFinite(this.boundingSphere.radius)) {
          this.boundingSphere.radius = 300;
          this.boundingSphere.center.set(0, 0, 0);
        }
      };

      THREE.BufferGeometry.prototype.computeBoundingBox = function () {
        if (!this.boundingBox) {
          this.boundingBox = new THREE.Box3();
        }
        const position = this.attributes.position;
        if (position && position.count > 0) {
          let minX = Infinity, minY = Infinity, minZ = Infinity;
          let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
          let validCount = 0;
          for (let i = 0, il = position.count; i < il; i++) {
            const x = position.getX(i);
            const y = position.getY(i);
            const z = position.getZ(i);
            if (!isNaN(x) && !isNaN(y) && !isNaN(z) && isFinite(x) && isFinite(y) && isFinite(z)) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (z < minZ) minZ = z;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
              if (z > maxZ) maxZ = z;
              validCount++;
            }
          }
          if (validCount > 0) {
            this.boundingBox.min.set(minX, minY, minZ);
            this.boundingBox.max.set(maxX, maxY, maxZ);
          } else {
            this.boundingBox.min.set(-300, -300, -300);
            this.boundingBox.max.set(300, 300, 300);
          }
        } else {
          this.boundingBox.min.set(-300, -300, -300);
          this.boundingBox.max.set(300, 300, 300);
        }
      };
    }

    // Capture console.error and console.warn calls targeting NaN bounding volume calculations
    if (typeof window !== "undefined") {
      const originalConsoleError = window.console.error;
      window.console.error = function (...args) {
        if (
          args &&
          args[0] &&
          typeof args[0] === "string" &&
          (args[0].indexOf("computeBoundingSphere(): Computed radius is NaN") !== -1 ||
           args[0].indexOf("Computed radius is NaN") !== -1)
        ) {
          return;
        }
        originalConsoleError.apply(window.console, args);
      };

      const originalConsoleWarn = window.console.warn;
      window.console.warn = function (...args) {
        if (
          args &&
          args[0] &&
          typeof args[0] === "string" &&
          (args[0].indexOf("computeBoundingSphere(): Computed radius is NaN") !== -1 ||
           args[0].indexOf("Computed radius is NaN") !== -1)
        ) {
          return;
        }
        originalConsoleWarn.apply(window.console, args);
      };
    }
  </script>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- POSTPROCESSING (Phase 2 needs these) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>

<body>

  <!-- THREE.JS renders into this -->
  <canvas id="solomon-canvas"></canvas>

  <!-- UI LABELS (CSS only, over canvas) -->
  <div id="ui-top">Solomon</div>
  <div id="ui-bottom">
    <span id="ui-status"></span>
    <span id="ui-sub"></span>
  </div>
  <div id="ui-ring-label"></div>

  <!-- TOOLTIP (shared, moved by JS) -->
  <div id="ring-tooltip"></div>

  <!-- PHASES — order matters, do not change -->
  <script src="js/phase1.js"></script>
  <script>
    // Prevent flash of uninitialized sigil/rings before boot.js runs
    const _origComposerRender = THREE.EffectComposer.prototype.render;
    THREE.EffectComposer.prototype.render = function(deltaTime) {
      if (typeof window.solomonBootComplete === 'undefined') return;
      _origComposerRender.call(this, deltaTime);
    };
  </script>
  <script src="js/phase2.js"></script>
  <script src="js/phase3.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/warp.js"></script>
  <script src="js/solomon-ws.js"></script>

</body>

</html>
